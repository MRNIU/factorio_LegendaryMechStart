[mod-name]
LegendaryMechStart=以传奇机甲开局

[mod-description]
LegendaryMechStart=每个玩家出生即穿戴满装备的传奇机甲，团队工业资源一次性落地在地图原点附近的传奇钢箱里，并可在每个行星生成满配传奇蜘蛛机甲。

[mod-setting-name]
LegendaryMechStart-spawn-spidertron=生成传奇蜘蛛机甲
LegendaryMechStart-include-science-packs=包含七色传奇科技瓶

[mod-setting-description]
LegendaryMechStart-spawn-spidertron=启用后，每个行星 surface 会生成一台满配传奇蜘蛛机甲。关闭后不再生成新的蜘蛛机甲，已生成的蜘蛛不会被移除。
LegendaryMechStart-include-science-packs=在团队资源发放前启用时，母星货物会包含红、绿、黑、蓝、紫、黄、白七种科技瓶各 2000 个，品质为传奇。
