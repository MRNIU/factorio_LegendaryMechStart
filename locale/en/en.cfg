[mod-name]
LegendaryMechStart=Legendary Mech Start

[mod-description]
LegendaryMechStart=Start each player with fully-equipped legendary mech armor, place team industrial resources near map spawn, and optionally spawn fully-equipped legendary spidertrons on each planet.

[mod-setting-name]
LegendaryMechStart-spawn-spidertron=Spawn legendary spidertrons
LegendaryMechStart-include-science-packs=Include seven-color legendary science packs

[mod-setting-description]
LegendaryMechStart-spawn-spidertron=When enabled, each planet surface gets one fully-equipped legendary spidertron. Turning this off prevents new spidertrons from spawning; existing spidertrons are not removed.
LegendaryMechStart-include-science-packs=When enabled before the team resource cache is delivered, the Nauvis cargo includes 2000 legendary red, green, black, blue, purple, yellow, and white science packs.
